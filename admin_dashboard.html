<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Admin Dashboard</h2>

    <!-- Add Book Form -->
    <h3>Add Book</h3>
    <form method="post" action="/add_book">
        <label>Author Name:</label>
        <input type="text" name="author_name" required><br>
        <input type="submit" value="Add Book">
    </form>

    <!-- Delete Book Form -->
    <h3>Delete Book</h3>
    <form method="post" action="/delete_book">
        <label>Book ID:</label>
        <input type="number" name="book_id" required><br>
        <input type="submit" value="Delete Book">
    </form>

    <!-- Late Fees Section -->
    <h3>Late Fees</h3>
    <ul>
    {% for fee in late_fees %}
        <li>PRN: {{ fee[0] }}, Late Fee: ₹{{ fee[1] }}</li>
    {% endfor %}
    </ul>

    <!-- Logout Link -->
    <a href="/admin_login">Logout</a>
</body>
</html>
